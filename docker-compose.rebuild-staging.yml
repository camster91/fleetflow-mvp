services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fleetvera_rebuild_staging
      POSTGRES_USER: fleetvera_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - fleetvera_rebuild_staging_database_v1:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U fleetvera_owner -d fleetvera_rebuild_staging]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build:
      context: ./replacement
      target: runtime
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:?required}
    environment:
      DATABASE_URL: ${DATABASE_OWNER_URL}
      REBUILD_DATABASE_NAME: fleetvera_rebuild_staging
    command: [node, src/migrate.mjs]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  runtime-role:
    build:
      context: ./replacement
      target: db-init
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:?required}
    environment:
      PGHOST: postgres
      PGDATABASE: fleetvera_rebuild_staging
      PGUSER: fleetvera_owner
      PGPASSWORD: ${POSTGRES_PASSWORD}
      RUNTIME_PASSWORD: ${RUNTIME_DATABASE_PASSWORD}
    tmpfs:
      - /var/lib/postgresql/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
  app:
    build:
      context: ./replacement
      target: runtime
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:?required}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REBUILD_DATABASE_NAME: fleetvera_rebuild_staging
      APP_ORIGIN: https://fleetvera-staging.invalid
      SETUP_TOKEN: ${SETUP_TOKEN}
    depends_on:
      runtime-role:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
volumes:
  fleetvera_rebuild_staging_database_v1:
