services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:?Set NEXT_PUBLIC_SENTRY_DSN}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - FLEETVERA_RELEASE_MODE=${FLEETVERA_RELEASE_MODE:?Set FLEETVERA_RELEASE_MODE to pilot or public}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - API_CURSOR_SECRET=${API_CURSOR_SECRET}
      - ACTION_PREVIEW_KEYS=${ACTION_PREVIEW_KEYS}
      - ACTION_PREVIEW_CURRENT_KID=${ACTION_PREVIEW_CURRENT_KID}
      - CRON_SECRET=${CRON_SECRET}
      - EMAIL_CONFIG_ENCRYPTION_KEY=${EMAIL_CONFIG_ENCRYPTION_KEY}
      - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PRICE_MONTHLY=${STRIPE_PRICE_MONTHLY}
      - STRIPE_PRICE_YEARLY=${STRIPE_PRICE_YEARLY}
      - STRIPE_PRICE_MONTHLY_AMOUNT=${STRIPE_PRICE_MONTHLY_AMOUNT}
      - STRIPE_PRICE_YEARLY_AMOUNT=${STRIPE_PRICE_YEARLY_AMOUNT}
      - STRIPE_PRICE_CURRENCY=${STRIPE_PRICE_CURRENCY}
      - MAPBOX_ACCESS_TOKEN=${MAPBOX_ACCESS_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: fleetflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fleetflow
      POSTGRES_USER: fleetflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    # PostgreSQL is reachable only from the internal Compose network.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetflow -d fleetflow"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
