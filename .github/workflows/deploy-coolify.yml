name: Deploy to Coolify

on:
  workflow_dispatch:
    inputs:
      confirmed_sha:
        description: Exact commit SHA that passed CI and is approved for production
        required: true
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: fleetflow-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger approved production deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      # main is the production branch (master is kept only as a mirror until it is retired).
      - name: Verify approved SHA is current main
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRMED_SHA: ${{ inputs.confirmed_sha }}
        run: |
          main_sha=$(gh api repos/${{ github.repository }}/commits/main --jq .sha)
          if [ "$CONFIRMED_SHA" != "$main_sha" ]; then
            echo "Confirmed SHA does not match current main."
            exit 1
          fi
      - name: Verify Ashbi Local CI succeeded for approved SHA
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRMED_SHA: ${{ inputs.confirmed_sha }}
        run: |
          gh api --method GET "repos/${{ github.repository }}/commits/$CONFIRMED_SHA/check-runs" \
            | jq --exit-status --arg sha "$CONFIRMED_SHA" \
              'any(.check_runs[];
                .name == "Ashbi Local CI"
                and .head_sha == $sha
                and .status == "completed"
                and .conclusion == "success")'
      - name: Trigger Coolify webhook
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          test -n "$COOLIFY_WEBHOOK"
          test -n "$COOLIFY_TOKEN"
          response_file=$(mktemp)
          http_code=$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" \
            --request POST "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN")
          cat "$response_file"
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Coolify rejected the deployment with HTTP $http_code."
            exit 1
          fi
