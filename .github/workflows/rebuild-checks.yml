name: Rebuild checks
on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main, codex/fresh-rebuild]
permissions:
  contents: read
jobs:
  fresh-rebuild:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-disposable-only
          POSTGRES_DB: fleetvera_rebuild_qa_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d fleetvera_rebuild_qa_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:qa-disposable-only@localhost:5432/fleetvera_rebuild_qa_ci
      REBUILD_DATABASE_NAME: fleetvera_rebuild_qa_ci
    defaults:
      run:
        working-directory: replacement
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: replacement/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run migrate && npm run migrate
      - run: npm test
      - run: docker build --target runtime --build-arg SOURCE_COMMIT=${{ github.sha }} -t fleetvera-rebuild-ci .
      - run: docker build --target db-init -t fleetvera-role-init-ci .
  browser-rebuild:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-disposable-only
          POSTGRES_DB: fleetvera_rebuild_qa_browser_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d fleetvera_rebuild_qa_browser_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:qa-disposable-only@localhost:5432/fleetvera_rebuild_qa_browser_ci
      REBUILD_DATABASE_NAME: fleetvera_rebuild_qa_browser_ci
      APP_ORIGIN: http://127.0.0.1:19391
      PORT: '19391'
      LOCAL_QA: 'true'
      SETUP_TOKEN: browser-qa-disposable-only-token-20261001
      RELEASE_SHA: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    defaults:
      run:
        working-directory: replacement
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: replacement/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Exercise the fresh browser application
        run: |
          npm run migrate
          npm run migrate
          sed 's/fleetvera_rebuild_staging/fleetvera_rebuild_qa_browser_ci/g' deploy/runtime-role.sql | docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -d fleetvera_rebuild_qa_browser_ci -v ON_ERROR_STOP=1 -v runtime_password=qa-disposable-runtime-only
          export DATABASE_URL=postgres://fleetvera_runtime:qa-disposable-runtime-only@localhost:5432/fleetvera_rebuild_qa_browser_ci
          node src/server.mjs > /tmp/fleetvera-browser.log 2>&1 &
          qa_pid=$!
          trap 'kill "$qa_pid" 2>/dev/null || true' EXIT
          node -e 'for(let i=0;i<40;i++){try{const r=await fetch("http://127.0.0.1:19391/api/health/ready");if(r.ok)process.exit(0);}catch{}await new Promise(r=>setTimeout(r,500));}process.exit(1);' --input-type=module
          node test/browser-qa.cjs
          docker restart "${{ job.services.postgres.id }}"
          node -e 'for(let i=0;i<40;i++){try{const r=await fetch("http://127.0.0.1:19391/api/health/ready");if(r.ok)process.exit(0);}catch{}await new Promise(r=>setTimeout(r,500));}process.exit(1);' --input-type=module
          kill -0 "$qa_pid"
          echo 'Database restart recovered without application process restart'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fleetvera-browser-qa
          path: |
            replacement/fleetvera-browser-verification.json
            replacement/fleetvera-browser-report.png
            replacement/fleetvera-browser-mobile.png
            replacement/fleetvera-browser-failure.png
          retention-days: 14
